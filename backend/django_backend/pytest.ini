[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# Django's test files are tests.py and test_*.py inside each app.
python_files = tests.py test_*.py
testpaths = accounts cards payments adminlogs adminpanel config
addopts = -ra
filterwarnings =
    ignore:Creating token for inactive user:UserWarning
    # staticfiles/ only exists after collectstatic (in the Docker image).
    ignore:No directory at:UserWarning
