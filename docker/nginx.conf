# Single public entry point: serves the React build and proxies the APIs, so
# the browser talks to one origin (no CORS, SameSite cookies just work).
#
#   /api/payments/, /health, /docs, /redoc, /openapi.json  -> FastAPI
#   /api/, /admin/, /static/                               -> Django
#   everything else                                        -> React (index.html)

server_tokens off;

upstream django  { server django:8000; }
upstream fastapi { server fastapi:8001; }

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # --- FastAPI payment service ---
    location ^~ /api/payments/ { proxy_pass http://fastapi; }
    location = /health         { proxy_pass http://fastapi; }
    location = /docs           { proxy_pass http://fastapi; }
    location = /redoc          { proxy_pass http://fastapi; }
    location = /openapi.json   { proxy_pass http://fastapi; }

    # --- Django ---
    location ^~ /api/    { proxy_pass http://django; }
    location ^~ /admin/  { proxy_pass http://django; }
    # "/admin" (no slash) is the React admin dashboard. Without this exact match
    # nginx would 301-redirect it to /admin/ (the Django admin) on reload.
    location = /admin    { rewrite ^ /index.html last; }
    location ^~ /static/ { proxy_pass http://django; }

    # --- React single-page app ---
    # (Proxied responses keep the security headers set by Django/FastAPI.)
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # The React app only loads its own files and calls its own origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
